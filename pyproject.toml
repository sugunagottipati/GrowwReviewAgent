[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groww-review-pulse"
version = "0.1.0"
description = "Weekly Groww Play Store review pulse generator using LangChain and MCP"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Groww Product Pulse Team" },
]
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dateutil>=2.9.0",
    "google-play-scraper>=1.2.6",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "types-python-dateutil>=2.9.0",
]

[project.scripts]
groww-pulse = "groww_pulse.orchestration.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/groww_pulse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "google_play_scraper.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langdetect.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
