name: Weekly Review Pulse

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  generate-weekly-pulse:
    runs-on: ubuntu-latest
    env:
      RAILWAY_PULSE_RUN_URL: https://worker-production-8604.up.railway.app/api/pulse/run

    steps:
      - name: Trigger Railway pulse generation
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --output /tmp/pulse-run-response.json \
            "$RAILWAY_PULSE_RUN_URL"

          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/pulse-run-response.json").read_text())
          run = payload.get("run") or {}
          pulse = payload.get("pulse") or {}

          print("Railway pulse run triggered")
          print(f"run_id={run.get('id', 'unknown')}")
          print(f"status={run.get('status', 'unknown')}")
          print(f"review_count={run.get('review_count', 0)}")
          print(f"week_ending={pulse.get('week_ending', 'unknown')}")
          PY
